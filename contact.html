<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Designing What's Next</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;1,500&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=UnifrakturCook:wght@700&display=swap">
<link rel="stylesheet" href="style.css?v=20261109c">
<script>/* paint the saved colours before anything shows, and hold the page until the real content is in (max 2.5s) */
(function(){var d=document.documentElement;d.classList.add("is-loading");try{if(localStorage.getItem("ferricool-mode")==="dark")d.classList.add("predark");var v=JSON.parse(localStorage.getItem("ferricool-theme-vars")||"null");if(v)for(var k in v)d.style.setProperty(k,v[k])}catch(e){}setTimeout(function(){d.classList.remove("is-loading")},1500)})();</script>
</head>
<body>
<header class="sitebar" id="sitebar">
  <a class="sb-logo" href="index.html" id="navLogo">ADEDEJI SAMUEL / DESIGN</a>
  <div class="sb-right">
    <nav class="sb-links" id="navLinks" aria-label="Main"></nav>
    <a class="sb-cta" id="navCta" href="contact.html">Let's talk</a>
  </div>
  <button class="sb-burger" id="sbBurger" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
</header>

<main class="contact-page" id="contact">
  <a class="contact-back" id="contactBack" href="index.html">← Back home</a>
  <div class="contact-grid">
    <div class="contact-intro">
      <div class="small" id="contactSmall">Start a project</div>
      <h1 id="contactPageHeading">Let's talk.</h1>
      <h2 id="contactSub">Tell me about your project.</h2>
      <p id="contactBody">Share a little about what you have in mind.</p>
      <div class="contact-info"><span id="contactAvailable">Available for selected projects</span><a class="email" id="contactEmail" href="mailto:samuel.s.adedeji@gmail.com">samuel.s.adedeji@gmail.com ↗</a></div>
    </div>
    <div class="contact-card">
      <form class="contact-form" id="contactForm" action="https://formsubmit.co/samuel.s.adedeji@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New message from your portfolio">
        <input type="hidden" name="_captcha" value="false">
        <div class="contact-form-row">
          <label>Name<input type="text" name="name" required autocomplete="name"></label>
          <label>Email<input type="email" name="email" required autocomplete="email"></label>
        </div>
        <label><span id="whatsappLabel">WhatsApp number (optional)</span><input type="tel" name="whatsapp" autocomplete="tel" placeholder="+234 …"></label>
        <label>What are you looking to build?<textarea name="message" rows="5" required></textarea></label>
        <button type="submit" class="contact-submit">Send message <span>↗</span></button>
        <p class="contact-form-status" id="contactFormStatus" role="status"></p>
      </form>
    </div>
  </div>
</main>
<footer class="footer"><span id="footerLeft">© 2026 Adedeji Samuel</span><span id="footerRight">Designed with intention / Lagos</span></footer>

<a class="floating-badge" id="floatingBadge" href="contact.html" aria-label="Go to contact page">
  <img class="floating-badge-img" id="floatingBadgeImg" alt="" hidden>
  <svg id="floatingBadgeSvg" viewBox="0 0 120 120" class="floating-badge-ring" aria-hidden="true">
    <defs><path id="badgeCirclePath" d="M60,60 m-50,0 a50,50 0 1,1 100,0 a50,50 0 1,1 -100,0"/></defs>
    <text><textPath id="badgeCircleText" href="#badgeCirclePath" startOffset="0%"></textPath></text>
  </svg>
  <span class="floating-badge-center"><b id="floatingBadgeInitials">SA</b><i>.</i></span>
</a>

<script src="script.js?v=20261109c" defer></script>
</body></html>
